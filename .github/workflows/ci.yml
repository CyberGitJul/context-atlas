name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree for secrets (gitleaks, uses .gitleaks.toml)
        run: >
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --no-git --no-banner --redact -v
